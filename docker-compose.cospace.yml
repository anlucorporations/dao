version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: cooperativa-postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  anvil:
    build:
      context: ./contracts
      dockerfile: Dockerfile.anvil
    container_name: cooperativa-anvil
    ports:
      - "8545:8545"
    volumes:
      - ./contracts/deployments:/app/deployments
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.cospace
    container_name: cooperativa-web
    ports:
      - "3000:3000"
    env_file: web/.env.docker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_ANVIL_RPC: ${NEXT_PUBLIC_ANVIL_RPC}
      NEXT_PUBLIC_ANVIL_RPC_URL: ${NEXT_PUBLIC_ANVIL_RPC_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

volumes:
  postgres_data:
